<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reelbox — Boxy Bookmark Brain</title>
    <link rel="icon" type="image/svg+xml" href="/static/logo_icon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-workspace: #0e0e11;
            --bg-sidebar: #09090b;
            --bg-card: #15151a;
            --bg-card-hover: #1c1c24;
            --bg-preview: #1a1a23;
            --border-subtle: #22222a;
            --border-strong: #32323e;
            --text-main: #f4f4f7;
            --text-muted: #9ba1ad;
            --text-dim: #606470;
            --accent: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.25);
            --green: #10b981;
            --blue: #38bdf8;
            --pink: #f43f5e;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-workspace);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* ── Left Sidebar (Navigation by Category) ── */
        .sidebar {
            width: 250px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            user-select: none;
            height: 100vh;
        }

        .sidebar-header {
            padding: 18px 16px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-subtle);
        }

        .brand-pill {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-main);
        }

        .brand-pill img {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .brand-pill .title {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .brand-pill .title span { color: var(--accent); }

        .user-switcher {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .user-select {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            outline: none;
            cursor: pointer;
        }

        .sidebar-menu {
            flex: 1;
            overflow-y: auto;
            padding: 12px 10px;
        }

        .nav-section-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-dim);
            padding: 10px 10px 6px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            border-radius: var(--radius-sm);
            color: var(--text-muted);
            font-size: 13.5px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.12s;
            margin-bottom: 3px;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
        }

        .nav-item.active {
            background: #1f1f2a;
            color: #fff;
            font-weight: 600;
            border-left: 2.5px solid var(--accent);
        }

        .nav-item-left {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .nav-count {
            font-size: 11px;
            color: var(--text-dim);
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 7px;
            border-radius: 10px;
        }

        .nav-item.active .nav-count {
            background: var(--accent);
            color: #fff;
        }

        .sidebar-footer {
            padding: 14px;
            border-top: 1px solid var(--border-subtle);
        }

        .btn-export-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background: #16161c;
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn-export-link:hover {
            background: #202028;
            color: #fff;
            border-color: var(--border-strong);
        }

        /* ── Workspace ── */
        .workspace {
            flex: 1;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg-workspace);
        }

        /* Header / Top Bar */
        .topbar {
            height: 56px;
            border-bottom: 1px solid var(--border-subtle);
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            background: rgba(14, 14, 17, 0.95);
            backdrop-filter: blur(12px);
            z-index: 20;
            flex-shrink: 0;
        }

        .global-search-container {
            flex: 1;
            max-width: 560px;
            position: relative;
        }

        .global-search-box {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
        }

        .global-search-icon {
            position: absolute;
            left: 12px;
            color: var(--text-dim);
            pointer-events: none;
            display: flex;
            align-items: center;
            top: 50%;
            transform: translateY(-50%);
        }

        .global-search-input {
            width: 100%;
            background: #111116;
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            padding: 8px 75px 8px 36px;
            border-radius: var(--radius-md);
            font-size: 13px;
            outline: none;
            transition: all 0.18s;
            font-family: inherit;
        }

        .global-search-input:focus {
            background: #15151c;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .search-shortcut-badge {
            position: absolute;
            right: 10px;
            background: #1c1c24;
            border: 1px solid #2a2a34;
            color: var(--text-dim);
            font-size: 10px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            pointer-events: none;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .filter-select {
            background: #15151a;
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            padding: 6px 10px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            outline: none;
            cursor: pointer;
        }

        /* ── Category Focus Header Bar ── */
        .category-focus-bar {
            padding: 16px 24px 12px;
            border-bottom: 1px solid var(--border-subtle);
            background: #121216;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .category-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .category-title-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .category-main-heading {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.4px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .category-count-badge {
            font-size: 12px;
            background: rgba(139, 92, 246, 0.15);
            color: #c4b5fd;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 600;
        }

        /* Subcategories Filter Chips */
        .subcategory-chips {
            display: flex;
            align-items: center;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .subcategory-chips::-webkit-scrollbar { height: 3px; }
        .subcategory-chips::-webkit-scrollbar-thumb { background: #333; }

        .sub-chip {
            background: #1a1a22;
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 16px;
            font-size: 11.5px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.12s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .sub-chip:hover {
            background: #22222d;
            color: var(--text-main);
        }

        .sub-chip.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .sub-chip .chip-count {
            font-size: 10px;
            opacity: 0.8;
            background: rgba(0, 0, 0, 0.25);
            padding: 1px 5px;
            border-radius: 8px;
        }

        /* ── Workspace Content Canvas ── */
        .workspace-canvas {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        /* ═══════════════════════════════════════════════════════════════
           📦 ARCADE-INSPIRED VIDEO CARD GRID & LIST
           ═══════════════════════════════════════════════════════════════ */
        .boxy-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(296px, 1fr));
            gap: 22px;
            max-width: 1440px;
            margin: 0 auto;
        }

        /* List View Mode (Arcade style) */
        .boxy-grid.list-view {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 1100px;
        }

        .boxy-grid.list-view .boxy-card {
            flex-direction: row;
            align-items: center;
            min-height: 110px;
        }

        .boxy-grid.list-view .boxy-preview {
            width: 160px;
            height: 100%;
            border-bottom: none;
            border-right: 1px solid rgba(255, 255, 255, 0.06);
            flex-shrink: 0;
        }

        .boxy-grid.list-view .boxy-content {
            padding: 12px 18px;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            width: 100%;
        }

        .boxy-grid.list-view .arcade-meta-section {
            flex: 1;
            min-width: 0;
        }

        .boxy-grid.list-view .arcade-tags-row {
            margin-bottom: 0;
        }

        .boxy-grid.list-view .arcade-footer {
            margin-top: 0;
            padding-top: 0;
            border-top: none;
            flex-shrink: 0;
        }

        .boxy-grid.list-view .boxy-card.expanded {
            flex-wrap: wrap;
        }

        .boxy-grid.list-view .boxy-card.expanded .boxy-content {
            flex-wrap: wrap;
        }

        .boxy-grid.list-view .boxy-card.expanded .arcade-takeaways-drawer {
            width: 100%;
            flex-basis: 100%;
            margin-top: 14px;
        }

        /* Card Container (Arcade Elevation) */
        .boxy-card {
            background: #121217;
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), 
                        border-color 0.22s cubic-bezier(0.16, 1, 0.3, 1), 
                        box-shadow 0.22s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 18px -2px rgba(0, 0, 0, 0.45);
            position: relative;
        }

        .boxy-card:hover {
            transform: translateY(-3px);
            border-color: rgba(139, 92, 246, 0.38);
            box-shadow: 0 12px 28px -4px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(139, 92, 246, 0.18) inset;
        }

        /* Top 16:9 Thumbnail Preview */
        .boxy-preview {
            height: 168px;
            width: 100%;
            background: radial-gradient(circle at 50% 30%, #1e1e28 0%, #0d0d12 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            cursor: pointer;
        }

        .boxy-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .boxy-card:hover .boxy-preview img {
            transform: scale(1.04);
        }

        /* Ghost Play Trigger (Invisible in idle, reveals on hover) */
        .boxy-play-circle {
            position: absolute;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(10, 10, 15, 0.72);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.22);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            opacity: 0;
            transform: scale(0.9);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
            z-index: 2;
        }

        .boxy-play-circle svg {
            margin-left: 2px;
        }

        .boxy-card:hover .boxy-play-circle {
            opacity: 1;
            transform: scale(1);
            background: rgba(139, 92, 246, 0.9);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 16px rgba(139, 92, 246, 0.5);
        }

        .boxy-preview-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: var(--text-dim);
        }

        .boxy-preview-placeholder .platform-watermark {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a78bfa;
            opacity: 0.8;
        }

        .boxy-preview-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(8, 8, 12, 0.78);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #94a3b8; /* Same refined grey as boxy-number-badge */
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            padding: 2.5px 8px;
            border-radius: 5px;
            letter-spacing: 0.6px;
            z-index: 3;
            max-width: 150px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .boxy-number-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(8, 8, 12, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #94a3b8;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 600;
            padding: 2.5px 7px;
            border-radius: 5px;
            z-index: 3;
        }

        /* Card Content Area (Arcade Clean Flow) */
        .boxy-content {
            padding: 16px 16px 14px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .arcade-title {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.45;
            color: #f8fafc;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            letter-spacing: -0.012em;
            cursor: pointer;
            transition: color 0.15s ease;
            margin: 0 0 22px 0; /* Roomy whitespace between title and action buttons */
        }

        .arcade-title:hover { color: #c4b5fd; }

        .arcade-tags-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            margin-bottom: 12px;
        }

        .arcade-cat-pill {
            font-size: 11px;
            font-weight: 500;
            color: #c4b5fd;
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid rgba(139, 92, 246, 0.2);
            padding: 2px 7px;
            border-radius: 5px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .arcade-tag-pill {
            font-size: 11px;
            font-weight: 500;
            color: #94a3b8;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.07);
            padding: 2px 7px;
            border-radius: 5px;
            transition: all 0.15s ease;
        }

        .arcade-tag-pill:hover {
            color: #cbd5e1;
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.14);
        }

        /* Expandable Accordion Takeaways (Opens on the bottom side) */
        .arcade-takeaways-drawer {
            display: none;
            background: rgba(139, 92, 246, 0.06);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 8px;
            padding: 12px 14px;
            margin-top: 14px;
            margin-bottom: 2px;
            font-size: 12.5px;
            color: #cbd5e1;
            line-height: 1.55;
            animation: slideDownDrawer 0.18s ease-out;
        }

        .boxy-card.expanded .arcade-takeaways-drawer {
            display: block;
        }

        @keyframes slideDownDrawer {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .arcade-takeaways-drawer ul {
            margin-left: 18px;
            margin-top: 6px;
        }

        .arcade-takeaways-drawer li { margin-bottom: 4px; }

        /* Arcade-style Footer Action Dock */
        .arcade-footer {
            margin-top: auto;
            padding-top: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .arcade-footer-left {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .arcade-footer-right {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .arcade-action-btn {
            height: 28px;
            padding: 0 8px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.025);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #94a3b8;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            font-size: 11.5px;
            font-weight: 500;
            transition: all 0.16s ease;
            cursor: pointer;
            text-decoration: none;
        }

        .arcade-action-btn.icon-only {
            width: 28px;
            padding: 0;
        }

        .arcade-action-btn svg {
            transition: transform 0.18s ease;
        }

        .arcade-action-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.14);
            transform: translateY(-1px);
        }

        .arcade-action-btn.btn-sparkle:hover {
            color: #fbbf24;
            background: rgba(251, 191, 36, 0.12);
            border-color: rgba(251, 191, 36, 0.28);
        }

        .boxy-card.expanded .arcade-action-btn.btn-sparkle {
            color: #fbbf24;
            background: rgba(251, 191, 36, 0.16);
            border-color: rgba(251, 191, 36, 0.35);
        }

        .arcade-action-btn.btn-delete:hover {
            color: #fb7185;
            background: rgba(244, 63, 94, 0.12);
            border-color: rgba(244, 63, 94, 0.28);
        }

        /* View Switcher Controls (Arcade Style Grid/List) */
        .view-switch-group {
            display: flex;
            align-items: center;
            background: #181820;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 2px;
            gap: 2px;
        }

        .view-switch-btn {
            background: transparent;
            border: none;
            color: var(--text-dim);
            width: 28px;
            height: 28px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .view-switch-btn:hover {
            color: #fff;
        }

        .view-switch-btn.active {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        /* ── Side Drawer ── */
        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(4px);
            z-index: 100;
            display: none;
            justify-content: flex-end;
        }

        .drawer-overlay.active { display: flex; }

        .notion-drawer {
            width: 580px;
            max-width: 90vw;
            background: #16161b;
            height: 100%;
            border-left: 1px solid var(--border-strong);
            padding: 32px 36px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .drawer-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #22222a;
            border: 1px solid #33333f;
            color: var(--text-muted);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .empty-state {
            text-align: center;
            padding: 90px 20px;
            color: var(--text-muted);
        }

        .empty-state .icon { font-size: 44px; margin-bottom: 12px; }
        .empty-state h3 { font-size: 18px; color: #fff; margin-bottom: 6px; }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .topbar { padding: 0 16px; }
            .workspace-canvas { padding: 16px; }
        }
    </style>
</head>
<body>

    <!-- ── LEFT SIDEBAR (Category Navigation) ── -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <a href="/" class="brand-pill">
                <img src="/static/logo_icon.svg" alt="Reelbox">

                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>

    <script>
        // ── STATE ──
        let currentUser = null;
        let selectedCategory = null;      // Selected category in sidebar (null = all)
        let selectedSubcategory = null;   // Selected subcategory chip (null = all)
        let currentReels = [];
        let categoriesData = [];
        let activeReel = null;
        let searchDebounceTimer = null;
        let pollTimer = null;
        let lastReelCount = 0;

        const CATEGORY_EMOJIS = {
            'design': '🎨', 'tech & ai': '🤖', 'movies & shows': '🎬',
            'food & cooking': '🍳', 'music': '🎵', 'fitness & health': '💪',
            'travel': '✈️', 'business & finance': '💼', 'education': '📚',
            'fashion & beauty': '👗', 'humor & memes': '😂',
            'motivation & self-help': '🚀', 'photography & videography': '📷',
            'tools & apps': '🔧', 'other': '📌', 'uncategorized': '❓',
        };

        function getEmoji(cat) {
            return CATEGORY_EMOJIS[(cat || '').toLowerCase()] || '📌';
        }

        function getCategorySvg(cat) {
            const c = (cat || '').toLowerCase();
            if (c.includes('design')) {
                return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></svg>`;
            }
            if (c.includes('tech') || c.includes('ai')) {
                return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="16" x="4" y="4" rx="2"/><rect width="6" height="6" x="9" y="9" rx="1"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/></svg>`;
            }
            if (c.includes('movie') || c.includes('show') || c.includes('video') || c.includes('photo')) {
                return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="20" x="2" y="2" rx="2.18"/><line x1="7" x2="7" y1="2" y2="22"/><line x1="17" x2="17" y1="2" y2="22"/><line x1="2" x2="22" y1="12" y2="12"/><line x1="2" x2="7" y1="7" y2="7"/><line x1="2" x2="7" y1="17" y2="17"/><line x1="17" x2="22" y1="17" y2="17"/><line x1="17" x2="22" y1="7" y2="7"/></svg>`;
            }
            if (c.includes('food') || c.includes('cook')) {
                return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2v8a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V2"/><line x1="6" x2="6" y1="2" y2="7"/><line x1="10" x2="10" y1="2" y2="7"/><line x1="14" x2="14" y1="2" y2="7"/><line x1="12" x2="12" y1="14" y2="22"/></svg>`;
            }
            if (c.includes('music')) {
                return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>`;
            }
            if (c.includes('business') || c.includes('finance')) {
                return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="7" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>`;
            }
            if (c.includes('fitness') || c.includes('health')) {
                return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>`;
            }
            if (c.includes('education') || c.includes('book') || c.includes('learn')) {
                return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10M6 10h10"/></svg>`;
            }
            if (c.includes('travel')) {
                return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>`;
            }
            return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>`;
        }

        // HTML entity decoder (converts &quot; to ", &#064; to @, etc.)
        function decodeHtmlEntities(str) {
            if (!str) return '';
            const txt = document.createElement('textarea');
            txt.innerHTML = str;
            return txt.value;
        }

        // Clean, human-friendly heading
        function getCleanHeading(r) {
            let raw = r.title || r.summary || r.subcategory || 'Bookmark #' + r.id;
            raw = decodeHtmlEntities(raw);

            // Extract content inside quotes if "Username on Instagram: 'Title'"
            const quoteMatch = raw.match(/on Instagram:\s*["“']([^"”']+)["”']/i);
            if (quoteMatch && quoteMatch[1].trim()) {
                return quoteMatch[1].trim();
            }

            // Strip "Username on Instagram:" prefix
            raw = raw.replace(/^[^:]+\s+on Instagram:\s*/i, '');
            
            if (raw.toLowerCase() === 'instagram' || raw.trim().length === 0) {
                if (r.subcategory && r.subcategory.toLowerCase() !== 'general') {
                    return decodeHtmlEntities(r.subcategory);
                }
                if (r.summary) {
                    return decodeHtmlEntities(r.summary.split('.')[0]);
                }
            }
            return raw;
        }

        // ── BOOTSTRAP ──
        async function init() {
            window.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
                    e.preventDefault();
                    document.getElementById('globalSearchInput').focus();
                }
            });

            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token') || localStorage.getItem('reelbox_vault_token');

            if (token) {
                try {
                    const resp = await fetch(`/api/vault/verify?token=${encodeURIComponent(token)}`);
                    if (resp.ok) {
                        const user = await resp.json();
                        currentUser = user.user_id;
                        localStorage.setItem('reelbox_vault_token', token);

                        const switcher = document.querySelector('.user-switcher');
                        if (switcher) {
                            switcher.style.display = 'none';
                        }
                        await refreshVault();
                        pollTimer = setInterval(pollForNewReels, 4000);
                        return;
                    } else {
                        localStorage.removeItem('reelbox_vault_token');
                    }
                } catch (e) {
                    console.error("Token verification failed:", e);
                }
            }

            // Fallback for local admin development
            await loadUsers();
            pollTimer = setInterval(pollForNewReels, 4000);
        }

        async function loadUsers() {
            try {
                const users = await (await fetch('/api/users')).json();
                const select = document.getElementById('userSelect');
                select.innerHTML = '';

                if (users.length === 0) {
                    select.innerHTML = '<option value="">No Vaults Found</option>';
                    showEmptyWorkspace("No Reels Saved Yet", "Send a reel link to @ReelboxxBot on Telegram to get started!");
                    return;
                }

                users.forEach(u => {
                    const opt = document.createElement('option');
                    opt.value = u.user_id;
                    opt.textContent = `${u.first_name || u.username || 'User ' + u.user_id} (${u.reel_count} reels)`;
                    select.appendChild(opt);
                });

                select.value = users[0].user_id;
                currentUser = users[0].user_id;
                const switcher = document.querySelector('.user-switcher');
                if (switcher) {
                    switcher.style.display = users.length > 1 ? 'block' : 'none';
                }
                await refreshVault();
            } catch (err) {
                console.error("Failed to load users:", err);
            }
        }

        function selectUser(userId) {
            if (!userId) return;
            currentUser = userId;
            selectedCategory = null;
            selectedSubcategory = null;
            refreshVault();
        }

        async function refreshVault() {
            if (!currentUser) return;
            await Promise.all([loadCategories(), loadReels()]);
        }

        async function pollForNewReels() {
            if (!currentUser) return;
            try {
                const stats = await (await fetch(`/api/reels/${currentUser}/stats`)).json();
                if (stats.total_reels !== lastReelCount && lastReelCount !== 0) {
                    console.log("⚡ New reel detected from Telegram! Refreshing...");
                    await refreshVault();
                }
                lastReelCount = stats.total_reels;
            } catch (e) {}
        }

        // ── SIDEBAR CATEGORIES ──
        async function loadCategories() {
            categoriesData = await (await fetch(`/api/reels/${currentUser}/categories`)).json();
            const total = categoriesData.reduce((s, c) => s + c.count, 0);
            document.getElementById('totalReelsCount').textContent = total;

            const sidebar = document.getElementById('sidebarCategories');
            sidebar.innerHTML = '';

            categoriesData.forEach(c => {
                const isActive = selectedCategory === c.category;
                const div = document.createElement('div');
                div.className = `nav-item ${isActive ? 'active' : ''}`;
                div.onclick = () => selectCategory(c.category);
                div.innerHTML = `
                    <div class="nav-item-left">
                        <span style="display:flex; align-items:center; opacity:0.85;">${getCategorySvg(c.category)}</span>
                        <span>${escapeHtml(c.category)}</span>
                    </div>
                    <span class="nav-count">${c.count}</span>
                `;
                sidebar.appendChild(div);
            });

            document.getElementById('navAll').classList.toggle('active', !selectedCategory);
            updateCategoryHeader();
        }

        function selectCategory(cat) {
            selectedCategory = cat;
            selectedSubcategory = null; // Reset subcategory when switching main category
            loadCategories();
            loadReels();
        }

        function updateCategoryHeader() {
            const titleEl = document.getElementById('categoryHeaderTitle');
            const countEl = document.getElementById('categoryHeaderCount');

            if (!selectedCategory) {
                titleEl.innerHTML = `
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity: 0.85;"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
                    <span>All Bookmarks</span>
                `;
                countEl.textContent = document.getElementById('totalReelsCount').textContent;
            } else {
                const found = categoriesData.find(c => c.category === selectedCategory);
                titleEl.innerHTML = `
                    <span style="display:inline-flex; align-items:center; opacity:0.85;">${getCategorySvg(selectedCategory)}</span>
                    <span>${escapeHtml(selectedCategory)}</span>
                `;
                countEl.textContent = found ? found.count : '0';
            }
        }

        // ── REELS FETCHING & FILTERING ──
        async function loadReels() {
            let url = `/api/reels/${currentUser}?limit=350`;
            if (selectedCategory) url += `&category=${encodeURIComponent(selectedCategory)}`;

            const platform = document.getElementById('platformFilter').value;
            if (platform !== 'all') url += `&platform=${encodeURIComponent(platform)}`;

            const sortBy = document.getElementById('sortFilter').value;
            url += `&sort_by=${encodeURIComponent(sortBy)}`;

            const search = document.getElementById('globalSearchInput').value.trim();
            if (search) url += `&search=${encodeURIComponent(search)}`;

            try {
                currentReels = await (await fetch(url)).json();
                renderSubcategoryChips();
                renderBoxyCards();
            } catch (err) {
                console.error("Error loading reels:", err);
            }
        }

        function onSearchInput() {
            clearTimeout(searchDebounceTimer);
            searchDebounceTimer = setTimeout(() => {
                loadReels();
            }, 250);
        }

        function onFilterChange() {
            loadReels();
        }

        // ── SUBCATEGORY CHIPS (Filter within the active category) ──
        function renderSubcategoryChips() {
            const container = document.getElementById('subcategoryChips');
            
            // Collect unique subcategories from current reels
            const subMap = {};
            currentReels.forEach(r => {
                const sub = r.subcategory && r.subcategory.trim() && r.subcategory.toLowerCase() !== 'general'
                            ? r.subcategory.trim()
                            : 'General';
                subMap[sub] = (subMap[sub] || 0) + 1;
            });

            const keys = Object.keys(subMap);
            if (keys.length <= 1 && keys[0] === 'General') {
                container.style.display = 'none';
                return;
            }

            container.style.display = 'flex';
            let html = `
                <div class="sub-chip ${!selectedSubcategory ? 'active' : ''}" onclick="filterSubcategory(null)">
                    <span>All</span>
                    <span class="chip-count">${currentReels.length}</span>
                </div>
            `;

            keys.forEach(sub => {
                const isActive = selectedSubcategory === sub;
                html += `
                    <div class="sub-chip ${isActive ? 'active' : ''}" onclick="filterSubcategory('${escapeHtml(sub)}')">
                        <span>${escapeHtml(sub)}</span>
                        <span class="chip-count">${subMap[sub]}</span>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function filterSubcategory(sub) {
            selectedSubcategory = sub;
            renderSubcategoryChips();
            renderBoxyCards();
        }

        let currentViewMode = localStorage.getItem('reelbox_view_mode') || 'grid';

        function setViewMode(mode) {
            currentViewMode = mode;
            localStorage.setItem('reelbox_view_mode', mode);
            const gridBtn = document.getElementById('btnViewGrid');
            const listBtn = document.getElementById('btnViewList');
            if (gridBtn && listBtn) {
                gridBtn.classList.toggle('active', mode === 'grid');
                listBtn.classList.toggle('active', mode === 'list');
            }
            const canvas = document.querySelector('.boxy-grid');
            if (canvas) {
                canvas.classList.toggle('list-view', mode === 'list');
            }
        }

        function formatRelativeTime(dateStr) {
            if (!dateStr) return 'Recently';
            try {
                const date = new Date(dateStr.replace(' ', 'T') + 'Z');
                const now = new Date();
                const diffSec = Math.floor((now - date) / 1000);
                if (isNaN(diffSec) || diffSec < 0) return 'Recently';
                if (diffSec < 60) return 'Just now';
                const diffMin = Math.floor(diffSec / 60);
                if (diffMin < 60) return `Saved ${diffMin}m ago`;
                const diffHours = Math.floor(diffMin / 60);
                if (diffHours < 24) return `Saved ${diffHours}h ago`;
                const diffDays = Math.floor(diffHours / 24);
                if (diffDays === 1) return 'Saved yesterday';
                if (diffDays < 30) return `Saved ${diffDays}d ago`;
                const diffMonths = Math.floor(diffDays / 30);
                return `Saved ${diffMonths}mo ago`;
            } catch (e) {
                return 'Recently';
            }
        }

        // ═════════════════════════════════════════════════════════════════
        // 📦 RENDER BOXY CARDS (Arcade Inspiration Pattern)
        // ═════════════════════════════════════════════════════════════════
        function renderBoxyCards() {
            const canvas = document.getElementById('workspaceCanvas');

            // Apply local subcategory filter if selected
            let filtered = currentReels;
            if (selectedSubcategory) {
                filtered = currentReels.filter(r => {
                    const sub = r.subcategory && r.subcategory.trim() ? r.subcategory.trim() : 'General';
                    return sub.toLowerCase() === selectedSubcategory.toLowerCase();
                });
            }

            if (!filtered || filtered.length === 0) {
                const search = document.getElementById('globalSearchInput').value.trim();
                showEmptyWorkspace(
                    search ? `No matches for "${search}"` : "No Bookmarks in this Category",
                    search ? "Try searching with a different keyword or platform." : "Send reels to @ReelboxxBot on Telegram to populate this category!"
                );
                return;
            }

            const isList = currentViewMode === 'list';
            let html = `<div class="boxy-grid ${isList ? 'list-view' : ''}">`;

            filtered.forEach((r, idx) => {
                const num = String(idx + 1).padStart(2, '0');
                const cleanHeading = getCleanHeading(r);
                const points = JSON.parse(r.key_points || '[]');
                const hasThumb = r.thumbnail_url && r.thumbnail_url.startsWith('http');
                const timeAgo = formatRelativeTime(r.created_at);

                // Category or subcategory to show in the red badge on thumbnail
                const catLabel = (r.subcategory && r.subcategory.trim() && r.subcategory.toLowerCase() !== 'general')
                                 ? r.subcategory.trim()
                                 : (r.category || 'Bookmark');

                // Clean author name (omit if it's just 'Instagram' or empty)
                const authorClean = (r.author_name && !r.author_name.toLowerCase().includes('instagram')) 
                                    ? r.author_name.trim() 
                                    : '';

                html += `
                    <div class="boxy-card" id="card_${r.id}">
                        
                        <!-- Top 16:9 Thumbnail Preview (Arcade Style) -->
                        <div class="boxy-preview" onclick="window.open('${escapeHtml(r.url)}', '_blank')" title="Click to open reel ↗">
                            <span class="boxy-number-badge">#${num}</span>
                            <span class="boxy-preview-badge" title="${escapeHtml(catLabel)}">${escapeHtml(catLabel)}</span>

                            <!-- Ghost Play Button (reveals on hover) -->
                            <div class="boxy-play-circle">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11-6.86a1 1 0 0 0 0-1.72l-11-6.86A1 1 0 0 0 8 5.14z"/>
                                </svg>
                            </div>

                            ${hasThumb ? `
                                <img src="/api/thumbnail/${r.id}" referrerpolicy="no-referrer" alt="${escapeHtml(cleanHeading)}" onerror="this.style.display='none'">
                            ` : `
                                <div class="boxy-preview-placeholder">
                                    <div class="platform-watermark">${getCategorySvg(r.category)}</div>
                                    <span style="font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:1px; opacity:0.6;">${escapeHtml(catLabel)}</span>
                                </div>
                            `}
                        </div>

                        <!-- Card Content (Arcade Clean Flow) -->
                        <div class="boxy-content">
                            <div class="arcade-meta-section">
                                <!-- Clean Headline -->
                                <h3 class="arcade-title" onclick="window.open('${escapeHtml(r.url)}', '_blank')" title="Click to open reel ↗">
                                    ${escapeHtml(cleanHeading)}
                                </h3>
                            </div>

                            <!-- Bottom Action Toolbar (Arcade Footer Dock) -->
                            <div class="arcade-footer">
                                <div class="arcade-footer-left">
                                    <button class="arcade-action-btn btn-sparkle" title="Toggle AI Takeaways" onclick="toggleTakeaways(${r.id})">
                                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
                                        </svg>
                                        <span>${points.length > 0 ? points.length + ' points' : 'Takeaways'}</span>
                                    </button>
                                </div>

                                <div class="arcade-footer-right">
                                    <button class="arcade-action-btn icon-only" title="Copy Link" onclick="copyLink('${escapeHtml(r.url)}', this)">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                            <rect width="13" height="13" x="9" y="9" rx="2" ry="2"/>
                                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                                        </svg>
                                    </button>
                                    <button class="arcade-action-btn icon-only" title="Details Drawer" onclick="openDrawer(${r.id})">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                            <circle cx="12" cy="12" r="10"/>
                                            <line x1="12" y1="12" x2="12" y2="16"/>
                                            <line x1="12" y1="8" x2="12.01" y2="8"/>
                                        </svg>
                                    </button>
                                    <a href="${escapeHtml(r.url)}" target="_blank" class="arcade-action-btn icon-only" title="Open Original Link" onclick="event.stopPropagation()">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                            <path d="M15 3h6v6"/>
                                            <path d="M10 14 21 3"/>
                                            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                                        </svg>
                                    </a>
                                    <button class="arcade-action-btn icon-only btn-delete" title="Delete Bookmark" onclick="deleteReel(${r.id})">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                            <path d="M3 6h18"/>
                                            <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
                                            <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
                                        </svg>
                                    </button>
                                </div>
                            </div>

                            <!-- Expandable AI Takeaways (Opens on the bottom side) -->
                            <div class="arcade-takeaways-drawer">
                                <div style="font-size:11px; font-weight:700; color:#fbbf24; margin-bottom:6px; display:flex; align-items:center; gap:6px;">
                                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
                                    <span>AI Key Takeaways</span>
                                </div>
                                ${points.length > 0 ? `
                                    <ul>${points.slice(0, 3).map(p => `<li>${escapeHtml(p)}</li>`).join('')}</ul>
                                ` : `<div>${escapeHtml(r.summary || 'Saved bookmark')}</div>`}
                            </div>
                        </div>
                    </div>
                `;
            });

            html += '</div>';
            canvas.innerHTML = html;
        }

        // Toggle inline AI takeaways drawer on a boxy card
        function toggleTakeaways(reelId) {
            const card = document.getElementById(`card_${reelId}`);
            if (card) {
                card.classList.toggle('expanded');
            }
        }

        // Copy link to clipboard with visual confirmation
        function copyLink(url, btn) {
            navigator.clipboard.writeText(url).then(() => {
                const orig = btn.innerHTML;
                btn.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
                btn.style.borderColor = 'rgba(52, 211, 153, 0.4)';
                btn.style.background = 'rgba(52, 211, 153, 0.12)';
                setTimeout(() => { 
                    btn.innerHTML = orig; 
                    btn.style.borderColor = '';
                    btn.style.background = '';
                }, 1200);
            });
        }

        // ── DRAWER DETAILS ──
        function openDrawer(reelId) {
            const reel = currentReels.find(r => r.id === reelId);
            if (!reel) return;
            activeReel = reel;

            document.getElementById('drawerIcon').innerHTML = `<div style="width:40px; height:40px; border-radius:10px; background:rgba(139,92,246,0.12); border:1px solid rgba(139,92,246,0.25); display:flex; align-items:center; justify-content:center; color:#c4b5fd;">${getCategorySvg(reel.category)}</div>`;
            document.getElementById('drawerTitle').textContent = getCleanHeading(reel);

            const thumbContainer = document.getElementById('drawerThumbContainer');
            const thumbImg = document.getElementById('drawerThumbImg');
            if (reel.thumbnail_url && reel.thumbnail_url.startsWith('http')) {
                thumbContainer.style.display = 'block';
                thumbImg.src = `/api/thumbnail/${reel.id}`;
            } else {
                thumbContainer.style.display = 'none';
            }
            document.getElementById('drawerCategory').innerHTML = `<div style="display:flex; align-items:center; gap:6px;">${getCategorySvg(reel.category)} <span>${escapeHtml(reel.category || 'Other')}</span></div>`;
            document.getElementById('drawerSubcategory').textContent = reel.subcategory || 'General';
            document.getElementById('drawerPlatform').textContent = (reel.platform || 'link').toUpperCase();
            document.getElementById('drawerDate').textContent = reel.created_at || '-';
            document.getElementById('drawerLink').href = reel.url;
            document.getElementById('drawerSummary').textContent = decodeHtmlEntities(reel.summary || 'No summary available.');

            const points = JSON.parse(reel.key_points || '[]');
            const pointsContainer = document.getElementById('drawerKeyPoints');
            if (points.length > 0) {
                document.getElementById('drawerTakeawaysSection').style.display = 'block';
                pointsContainer.innerHTML = `<ul style="margin-left:16px;">${points.map(p => `<li style="margin-bottom:6px;">${escapeHtml(decodeHtmlEntities(p))}</li>`).join('')}</ul>`;
            } else {
                document.getElementById('drawerTakeawaysSection').style.display = 'none';
            }

            document.getElementById('drawerOverlay').classList.add('active');
        }

        function closeDrawer(e) {
            if (e && e.target !== e.currentTarget && e.target.className !== 'drawer-close') return;
            document.getElementById('drawerOverlay').classList.remove('active');
            activeReel = null;
        }

        async function deleteCurrentReel() {
            if (!activeReel) return;
            await deleteReel(activeReel.id);
            closeDrawer();
        }

        async function deleteReel(id) {
            if (!confirm(`Delete bookmark #${id} from your vault?`)) return;
            try {
                await fetch(`/api/reels/${currentUser}/${id}`, { method: 'DELETE' });
                await refreshVault();
            } catch (err) {
                console.error("Failed to delete reel:", err);
            }
        }

        function exportData(format) {
            if (!currentUser) return;
            window.location.href = `/api/reels/${currentUser}/export?format=${format}`;
        }

        function showEmptyWorkspace(title, subtitle) {
            const canvas = document.getElementById('workspaceCanvas');
            canvas.innerHTML = `
                <div class="empty-state">
                    <div class="icon" style="display:flex; justify-content:center; margin-bottom:14px; opacity:0.35;">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>
                    </div>
                    <h3>${escapeHtml(title)}</h3>
                    <p style="font-size:13px; max-width:400px; margin:0 auto; line-height:1.5;">${escapeHtml(subtitle)}</p>
                </div>
            `;
        }

        function escapeHtml(str) {
            const d = document.createElement('div');
            d.textContent = str || '';
            return d.innerHTML;
        }

        // Run
        init();
    </script>
</body>
</html>
