<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reelbox — Boxy Bookmark Brain</title>
    <link rel="icon" type="image/svg+xml" href="/static/logo_icon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-workspace: #0e0e11;
            --bg-sidebar: #09090b;
            --bg-card: #15151a;
            --bg-card-hover: #1c1c24;
            --bg-preview: #1a1a23;
            --border-subtle: #22222a;
            --border-strong: #32323e;
            --text-main: #f4f4f7;
            --text-muted: #9ba1ad;
            --text-dim: #606470;
            --accent: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.25);
            --green: #10b981;
            --blue: #38bdf8;
            --pink: #f43f5e;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #000000;
            color: var(--text-main);
            height: 100vh;
            min-height: 100vh;
            display: flex;
            overflow: hidden;
            padding: 10px;
            gap: 10px;
            box-sizing: border-box;
        }

        /* ── SUNO-INSPIRED CLEAN SIDEBAR ── */
        .sidebar {
            width: 240px;
            background: #0c0d12;
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            user-select: none;
            height: 100%;
            padding: 18px 12px 14px;
            box-sizing: border-box;
            transition: width 0.22s cubic-bezier(0.16, 1, 0.3, 1), padding 0.22s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        .sidebar.collapsed {
            width: 68px;
            padding: 18px 8px 14px;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6px 18px;
            box-sizing: border-box;
            height: auto;
            border-bottom: none;
        }

        .suno-brand {
            font-size: 21px;
            font-weight: 800;
            letter-spacing: -0.6px;
            color: #ffffff;
            text-transform: uppercase;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 2px;
            transition: opacity 0.15s ease;
        }

        .suno-brand span {
            color: #8b5cf6;
        }

        .sidebar.collapsed .suno-brand {
            display: none;
        }

        .suno-toggle-btn {
            background: none;
            border: none;
            color: #71717a;
            cursor: pointer;
            padding: 5px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }

        .suno-toggle-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
        }

        .sidebar.collapsed .sidebar-header {
            justify-content: center;
            padding: 0 0 16px;
        }

        .user-switcher {
            display: none !important;
        }

        .sidebar-menu {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            gap: 4px;
            scrollbar-width: none;
            padding: 0;
        }

        .sidebar-menu::-webkit-scrollbar {
            display: none;
        }

        /* Suno-Style Pill Navigation Item */
        .nav-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            height: 42px;
            border-radius: 9999px; /* Iconic Suno capsule pill */
            color: #94949e;
            font-size: 13.5px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.14s ease;
            text-decoration: none;
            box-sizing: border-box;
            border: none;
            background: transparent;
            user-select: none;
            margin-bottom: 0;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
        }

        .nav-item.active {
            background: rgba(255, 255, 255, 0.11); /* Soft Suno capsule highlight */
            color: #ffffff;
            font-weight: 600;
            border-left: none;
        }

        .nav-item-left {
            display: flex;
            align-items: center;
            gap: 13px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .nav-item-left svg {
            flex-shrink: 0;
            width: 17px;
            height: 17px;
            color: inherit;
        }

        .sidebar.collapsed .nav-item {
            justify-content: center;
            padding: 0;
            border-radius: 12px;
        }

        .sidebar.collapsed .nav-label {
            display: none;
        }

        .sidebar.collapsed .nav-count {
            display: none;
        }

        .nav-count {
            font-size: 11.5px;
            font-weight: 500;
            font-family: 'JetBrains Mono', monospace;
            color: #52525b;
            background: none;
            padding: 0;
            border-radius: 0;
            margin-left: 6px;
        }

        .nav-item:hover .nav-count {
            color: #94a3b8;
        }

        .nav-item.active .nav-count {
            color: #cbd5e1;
            background: none;
        }

        /* Suno-Style User Profile Pill (Like Suno's shobhitkeshari98) */
        .suno-profile-pill {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 14px;
            height: 42px;
            border-radius: 9999px;
            color: #a1a1aa;
            font-size: 13.5px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.14s ease;
            box-sizing: border-box;
            margin-top: auto; /* Clean bottom pin like Suno */
        }

        .suno-profile-pill:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
        }

        .suno-avatar {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: linear-gradient(135deg, #10b981 0%, #ec4899 100%);
            flex-shrink: 0;
        }

        .suno-username {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
        }

        .sidebar.collapsed .suno-profile-pill {
            justify-content: center;
            padding: 0;
        }

        .sidebar.collapsed .suno-username {
            display: none;
        }

        /* Generous Whitespace Spacer */
        .sidebar-spacer {
            height: 22px;
            flex-shrink: 0;
        }

        /* Suno-Style Bottom Capsule Action Button (Like Upgrade to Pro) */
        .sidebar-footer {
            padding: 10px 2px 2px;
            border-top: none;
            flex-shrink: 0;
        }

        .btn-suno-capsule {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            height: 42px;
            border-radius: 9999px; /* Iconic Suno capsule pill */
            background: #141419;
            border: 1px solid rgba(255, 255, 255, 0.14);
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.16s ease;
            text-decoration: none;
            box-sizing: border-box;
        }

        .btn-suno-capsule:hover {
            background: #202028;
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-1px);
        }

        .btn-suno-capsule:active {
            transform: scale(0.98);
        }

        .sidebar.collapsed .btn-suno-capsule {
            border-radius: 12px;
            padding: 0;
        }

        .sidebar.collapsed .btn-suno-capsule span {
            display: none;
        }

        /* ── Workspace (Main Canvas) ── */
        .workspace {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #0c0d12;
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 18px;
            box-sizing: border-box;
        }

        /* Header / Top Bar */
        .topbar {
            height: 56px;
            border-bottom: 1px solid var(--border-subtle);
            padding: 0 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            background: rgba(14, 14, 17, 0.95);
            backdrop-filter: blur(12px);
            z-index: 20;
            flex-shrink: 0;
            box-sizing: border-box;
        }

        .topbar-left-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            max-width: 620px;
        }

        .global-search-container {
            flex: 1;
            position: relative;
        }

        .global-search-box {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
        }

        .global-search-icon {
            position: absolute;
            left: 12px;
            color: var(--text-dim);
            pointer-events: none;
            display: flex;
            align-items: center;
            top: 50%;
            transform: translateY(-50%);
        }

        .global-search-input {
            width: 100%;
            height: 36px;
            background: #111116;
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            padding: 0 58px 0 36px;
            border-radius: var(--radius-md);
            font-size: 13px;
            outline: none;
            transition: all 0.18s;
            font-family: inherit;
            box-sizing: border-box;
        }

        .global-search-input:focus {
            background: #15151c;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .search-shortcut-badge {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #52525b;
            font-size: 11px;
            font-weight: 500;
            font-family: 'JetBrains Mono', monospace;
            pointer-events: none;
            letter-spacing: 0.2px;
            user-select: none;
            display: flex;
            align-items: center;
        }

        /* ── CUSTOM MODERN PLATFORM DROPDOWN ── */
        .platform-filter-dropdown {
            position: relative;
            display: inline-block;
            flex-shrink: 0;
        }

        .platform-filter-btn {
            display: inline-flex;
            align-items: center;
            gap: 7.5px;
            height: 36px;
            padding: 0 11px 0 10px;
            background: #111116;
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            color: #94a3b8;
            font-size: 12.5px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            outline: none;
            transition: all 0.15s ease;
            user-select: none;
            box-sizing: border-box;
        }

        .platform-filter-btn:hover {
            background: #16161f;
            border-color: rgba(255, 255, 255, 0.18);
            color: #f8fafc;
        }

        .platform-filter-btn:active {
            transform: scale(0.98);
        }

        .platform-filter-btn.open {
            background: #16161f;
            border-color: rgba(255, 255, 255, 0.28);
            color: #f8fafc;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.05);
        }

        .platform-btn-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: inherit;
            flex-shrink: 0;
        }

        .platform-btn-label {
            white-space: nowrap;
            letter-spacing: -0.1px;
        }

        .platform-btn-chevron {
            color: #64748b;
            flex-shrink: 0;
            margin-left: 2px;
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), color 0.15s ease;
        }

        .platform-filter-btn:hover .platform-btn-chevron {
            color: #94a3b8;
        }

        .platform-filter-btn.open .platform-btn-chevron {
            transform: rotate(180deg);
            color: #f8fafc;
        }

        /* Floating Popover */
        .platform-popover-menu {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            min-width: 180px;
            background: #121218;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            box-shadow: 0 16px 36px -4px rgba(0, 0, 0, 0.7), 0 4px 12px -2px rgba(0, 0, 0, 0.5);
            padding: 5px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 2px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-4px) scale(0.98);
            transform-origin: top left;
            transition: opacity 0.15s ease, transform 0.15s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.15s;
            pointer-events: none;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .platform-popover-menu.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .platform-popover-header {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #52525b;
            padding: 6px 10px 4px;
            user-select: none;
        }

        .platform-popover-options {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .platform-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 7px 10px;
            background: transparent;
            border: none;
            border-radius: 6px;
            color: #cbd5e1;
            font-size: 12.5px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            text-align: left;
            transition: all 0.12s ease;
            box-sizing: border-box;
            outline: none;
        }

        .platform-option:hover {
            background: rgba(255, 255, 255, 0.07);
            color: #ffffff;
        }

        .platform-option.active {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            font-weight: 600;
        }

        .opt-left {
            display: inline-flex;
            align-items: center;
            gap: 9px;
        }

        .opt-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        .opt-check {
            display: inline-flex;
            align-items: center;
            color: var(--accent);
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.12s ease;
            flex-shrink: 0;
        }

        .platform-option.active .opt-check {
            opacity: 1;
            transform: scale(1);
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-left: auto;
        }

        /* Topbar Telegram CTA Capsule (Matches Suno / Export Notion Pill CTA) */
        .btn-topbar-cta {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 38px;
            padding: 0 16px;
            border-radius: 9999px;
            background: #141419;
            border: 1px solid rgba(255, 255, 255, 0.14);
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.16s ease;
            text-decoration: none;
            box-sizing: border-box;
            white-space: nowrap;
        }

        .btn-topbar-cta:hover {
            background: #202028;
            border-color: rgba(255, 255, 255, 0.25);
            color: #ffffff;
            transform: translateY(-1px);
        }

        .btn-topbar-cta:active {
            transform: scale(0.98);
        }

        .btn-topbar-cta svg {
            width: 14px;
            height: 14px;
            color: #38bdf8;
            transition: transform 0.15s ease;
        }

        .btn-topbar-cta:hover svg {
            transform: translateX(1px) translateY(-1px);
        }

        /* ── Workspace Content Canvas ── */
        .workspace-canvas {
            flex: 1;
            overflow-y: auto;
            padding: 28px 32px;
        }

        /* ═══════════════════════════════════════════════════════════════
           📦 ARCADE-INSPIRED VIDEO CARD GRID & LIST
           ═══════════════════════════════════════════════════════════════ */
        .boxy-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(296px, 1fr));
            gap: 24px;
            max-width: 1440px;
            margin: 0 auto;
        }

        /* Card Container (Arcade Elevation) */
        .boxy-card {
            background: #121217;
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), 
                        border-color 0.22s cubic-bezier(0.16, 1, 0.3, 1), 
                        box-shadow 0.22s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 18px -2px rgba(0, 0, 0, 0.45);
            position: relative;
        }

        .boxy-card:hover {
            transform: translateY(-3px);
            border-color: rgba(139, 92, 246, 0.38);
            box-shadow: 0 12px 28px -4px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(139, 92, 246, 0.18) inset;
        }

        /* Top 16:9 Thumbnail Preview */
        .boxy-preview {
            height: 168px;
            width: 100%;
            background: radial-gradient(circle at 50% 30%, #1e1e28 0%, #0d0d12 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            cursor: pointer;
        }

        .boxy-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .boxy-card:hover .boxy-preview img {
            transform: scale(1.04);
        }

        /* Ghost Play Trigger (Invisible in idle, reveals on hover) */
        .boxy-play-circle {
            position: absolute;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(10, 10, 15, 0.72);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.22);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            opacity: 0;
            transform: scale(0.9);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
            z-index: 2;
        }

        .boxy-play-circle svg {
            margin-left: 2px;
        }

        .boxy-card:hover .boxy-play-circle {
            opacity: 1;
            transform: scale(1);
            background: rgba(139, 92, 246, 0.9);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 16px rgba(139, 92, 246, 0.5);
        }

        .boxy-preview-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: var(--text-dim);
        }

        .boxy-preview-placeholder .platform-watermark {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a78bfa;
            opacity: 0.8;
        }

        .boxy-preview-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(8, 8, 12, 0.78);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #94a3b8; /* Same refined grey as boxy-number-badge */
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            padding: 2.5px 8px;
            border-radius: 5px;
            letter-spacing: 0.6px;
            z-index: 3;
            max-width: 150px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .boxy-number-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(8, 8, 12, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #94a3b8;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 600;
            padding: 2.5px 7px;
            border-radius: 5px;
            z-index: 3;
        }

        /* Card Content Area (Arcade Clean Flow) */
        .boxy-content {
            padding: 18px 18px 16px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .arcade-title {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.45;
            color: #f8fafc;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            letter-spacing: -0.012em;
            cursor: pointer;
            transition: color 0.15s ease;
            margin: 0 0 24px 0; /* Roomy whitespace between title and action buttons */
        }

        .arcade-title:hover { color: #c4b5fd; }

        .arcade-tags-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            margin-bottom: 12px;
        }

        .arcade-cat-pill {
            font-size: 11px;
            font-weight: 500;
            color: #c4b5fd;
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid rgba(139, 92, 246, 0.2);
            padding: 2px 7px;
            border-radius: 5px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .arcade-tag-pill {
            font-size: 11px;
            font-weight: 500;
            color: #94a3b8;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.07);
            padding: 2px 7px;
            border-radius: 5px;
            transition: all 0.15s ease;
        }

        .arcade-tag-pill:hover {
            color: #cbd5e1;
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.14);
        }

        /* Expandable Accordion Takeaways (Opens on the bottom side) */
        .arcade-takeaways-drawer {
            display: none;

            height: 32px;
            padding: 0;
        }

            transition: transform 0.18s ease;
        }

                return `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="16" x="4" y="4" rx="2"/><rect width="6" height="6" x="9" y="9" rx="1"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/></svg>`;

        // HTML entity decoder (converts &quot; to ", &#064; to @, etc.)
        function decodeHtmlEntities(str) {
            if (!str) return '';
            const txt = document.createElement('textarea');
            txt.innerHTML = str;
            return txt.value;
        }

        // Clean, human-friendly heading
        function getCleanHeading(r) {
            let raw = r.title || r.summary || r.subcategory || 'Bookmark #' + r.id;
            raw = decodeHtmlEntities(raw);

            // Extract content inside quotes if "Username on Instagram: 'Title'"
            const quoteMatch = raw.match(/on Instagram:\s*["“']([^"”']+)["”']/i);
            if (quoteMatch && quoteMatch[1].trim()) {
                return quoteMatch[1].trim();
            }

            // Strip "Username on Instagram:" prefix
            raw = raw.replace(/^[^:]+\s+on Instagram:\s*/i, '');
            
            if (raw.toLowerCase() === 'instagram' || raw.trim().length === 0) {
                if (r.subcategory && r.subcategory.toLowerCase() !== 'general') {
                    return decodeHtmlEntities(r.subcategory);
                }
                if (r.summary) {
                    return decodeHtmlEntities(r.summary.split('.')[0]);
                }
            }
            return raw;
        }

        // ── BOOTSTRAP ──
        async function init() {
            localStorage.removeItem('reelbox_view_mode');
            window.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
                    e.preventDefault();
                    document.getElementById('globalSearchInput').focus();
                }
            });

            const urlParams = new URLSearchParams(window.location.search);
            const isDemo = urlParams.get('demo') === 'true';
            const token = urlParams.get('token') || (!isDemo ? localStorage.getItem('reelbox_vault_token') : null);

            if (isDemo) {
                currentUser = 'demo';
                const switcher = document.querySelector('.user-switcher');
                if (switcher) switcher.style.display = 'none';
                await refreshVault();
                return;
            }

            if (token) {
                try {
                    const resp = await fetch(`/api/vault/verify?token=${encodeURIComponent(token)}`);
                    if (resp.ok) {
                        const user = await resp.json();
                        currentUser = user.user_id;
                        localStorage.setItem('reelbox_vault_token', token);

                        const nameEl = document.getElementById('sidebarUsername');
                        if (nameEl && (user.username || user.first_name)) {
                            nameEl.textContent = user.username || user.first_name;
                        }

                        const switcher = document.querySelector('.user-switcher');
                        if (switcher) {
                            switcher.style.display = 'none';
                        }
                        await refreshVault();
                        pollTimer = setInterval(pollForNewReels, 4000);
                        return;
                    } else {
                        localStorage.removeItem('reelbox_vault_token');
                    }
                } catch (e) {
                    console.error("Token verification failed:", e);
                }
            }

            // Fallback for local admin development
            await loadUsers();
            pollTimer = setInterval(pollForNewReels, 4000);
        }

        async function loadUsers() {
            try {
                const users = await (await fetch('/api/users')).json();
                const select = document.getElementById('userSelect');
                select.innerHTML = '';

                if (users.length === 0) {
                    select.innerHTML = '<option value="">No Vaults Found</option>';
                    showEmptyWorkspace("No Reels Saved Yet", "Send a reel link to @ReelboxxBot on Telegram to get started!");
                    return;
                }

                users.forEach(u => {
                    const opt = document.createElement('option');
                    opt.value = u.user_id;
                    opt.textContent = `${u.first_name || u.username || 'User ' + u.user_id} (${u.reel_count} reels)`;
                    select.appendChild(opt);
                });

                select.value = users[0].user_id;
                currentUser = users[0].user_id;
                const nameEl = document.getElementById('sidebarUsername');
                if (nameEl && users[0]) {
                    nameEl.textContent = users[0].username || users[0].first_name || 'shobhitkeshari98';
                }
                const switcher = document.querySelector('.user-switcher');
                if (switcher) {
                    switcher.style.display = users.length > 1 ? 'block' : 'none';
                }
                await refreshVault();
            } catch (err) {
                console.error("Failed to load users:", err);

            currentUser = userId;
            selectedCategory = null;
            selectedSubcategory = null;

        async function refreshVault() {
            if (!currentUser) return;
            await Promise.all([loadCategories(), loadReels()]);
        }

        async function pollForNewReels() {
            if (!currentUser) return;
            try {
                const stats = await (await fetch(`/api/reels/${currentUser}/stats`)).json();
                if (stats.total_reels !== lastReelCount && lastReelCount !== 0) {
                    console.log("⚡ New reel detected from Telegram! Refreshing...");
                    await refreshVault();
                }
                lastReelCount = stats.total_reels;
            } catch (e) {}
        }

            const container = document.getElementById('subcategoryChips');

            currentReels.forEach(r => {
                const sub = r.subcategory && r.subcategory.trim() && r.subcategory.toLowerCase() !== 'general'
                            ? r.subcategory.trim()
                            : 'General';
                subMap[sub] = (subMap[sub] || 0) + 1;
            });

            const keys = Object.keys(subMap);
            if (keys.length <= 1 && keys[0] === 'General') {
                container.style.display = 'none';

            container.style.display = 'flex';

        function formatRelativeTime(dateStr) {
            if (!dateStr) return 'Recently';
            try {
                const date = new Date(dateStr.replace(' ', 'T') + 'Z');
                const now = new Date();
                const diffSec = Math.floor((now - date) / 1000);
                if (isNaN(diffSec) || diffSec < 0) return 'Recently';
                if (diffSec < 60) return 'Just now';
                const diffMin = Math.floor(diffSec / 60);
                if (diffMin < 60) return `Saved ${diffMin}m ago`;
                const diffHours = Math.floor(diffMin / 60);
                if (diffHours < 24) return `Saved ${diffHours}h ago`;
                const diffDays = Math.floor(diffHours / 24);
                if (diffDays === 1) return 'Saved yesterday';
                if (diffDays < 30) return `Saved ${diffDays}d ago`;
                const diffMonths = Math.floor(diffDays / 30);
                return `Saved ${diffMonths}mo ago`;
            } catch (e) {
                return 'Recently';
            }
        }

                                    </button>
                                    <button class="arcade-action-btn icon-only" title="Details Drawer" onclick="openDrawer(${r.id})">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                            <circle cx="12" cy="12" r="10"/>
                                            <line x1="12" y1="12" x2="12" y2="16"/>
                                            <line x1="12" y1="8" x2="12.01" y2="8"/>
                                        </svg>
                                    </button>
                                    <a href="${escapeHtml(r.url)}" target="_blank" class="arcade-action-btn icon-only" title="Open Original Link" onclick="event.stopPropagation()">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                            <path d="M15 3h6v6"/>
                                            <path d="M10 14 21 3"/>
                                            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                                        </svg>
                                    </a>
                                    <button class="arcade-action-btn icon-only btn-delete" title="Delete Bookmark" onclick="deleteReel(${r.id})">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                            <path d="M3 6h18"/>
                                            <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
                                            <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
                                        </svg>
                                    </button>
                                </div>
                            </div>

                            <!-- Expandable AI Takeaways (Opens on the bottom side) -->
                            <div class="arcade-takeaways-drawer">
                                <div style="font-size:11px; font-weight:700; color:#fbbf24; margin-bottom:6px; display:flex; align-items:center; gap:6px;">
                                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
                                    <span>AI Key Takeaways</span>
                                </div>
                                ${points.length > 0 ? `
                                    <ul>${points.slice(0, 3).map(p => `<li>${escapeHtml(p)}</li>`).join('')}</ul>
                                ` : `<div>${escapeHtml(r.summary || 'Saved bookmark')}</div>`}
                            </div>
                        </div>
                    </div>
                `;
            });

            html += '</div>';
            canvas.innerHTML = html;
        }

        // Toggle inline AI takeaways drawer on a boxy card
        function toggleTakeaways(reelId) {
            const card = document.getElementById(`card_${reelId}`);
            if (card) {
                card.classList.toggle('expanded');
            }
        }

        // Copy link to clipboard with visual confirmation
        function copyLink(url, btn) {
            navigator.clipboard.writeText(url).then(() => {
                const orig = btn.innerHTML;
                btn.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
                btn.style.borderColor = 'rgba(52, 211, 153, 0.4)';
                btn.style.background = 'rgba(52, 211, 153, 0.12)';
                setTimeout(() => { 
                    btn.innerHTML = orig; 
                    btn.style.borderColor = '';
                    btn.style.background = '';
                }, 1200);
            });
        }

        // ── DRAWER DETAILS ──
        function openDrawer(reelId) {
            const reel = currentReels.find(r => r.id === reelId);
            if (!reel) return;
            activeReel = reel;

            document.getElementById('drawerIcon').innerHTML = `<div style="width:40px; height:40px; border-radius:10px; background:rgba(139,92,246,0.12); border:1px solid rgba(139,92,246,0.25); display:flex; align-items:center; justify-content:center; color:#c4b5fd;">${getCategorySvg(reel.category)}</div>`;
            document.getElementById('drawerTitle').textContent = getCleanHeading(reel);

            const thumbContainer = document.getElementById('drawerThumbContainer');
            const thumbImg = document.getElementById('drawerThumbImg');
            if (reel.thumbnail_url && reel.thumbnail_url.startsWith('http')) {
                thumbContainer.style.display = 'block';
                thumbImg.src = `/api/thumbnail/${reel.id}`;
            } else {
                thumbContainer.style.display = 'none';
            }
            document.getElementById('drawerCategory').innerHTML = `<div style="display:flex; align-items:center; gap:6px;">${getCategorySvg(reel.category)} <span>${escapeHtml(reel.category || 'Other')}</span></div>`;
            document.getElementById('drawerSubcategory').textContent = reel.subcategory || 'General';
            document.getElementById('drawerPlatform').textContent = (reel.platform || 'link').toUpperCase();
            document.getElementById('drawerDate').textContent = reel.created_at || '-';
            document.getElementById('drawerLink').href = reel.url;
            document.getElementById('drawerSummary').textContent = decodeHtmlEntities(reel.summary || 'No summary available.');

            const points = JSON.parse(reel.key_points || '[]');
            const pointsContainer = document.getElementById('drawerKeyPoints');
            if (points.length > 0) {
                document.getElementById('drawerTakeawaysSection').style.display = 'block';
                pointsContainer.innerHTML = `<ul style="margin-left:16px;">${points.map(p => `<li style="margin-bottom:6px;">${escapeHtml(decodeHtmlEntities(p))}</li>`).join('')}</ul>`;
            } else {
                document.getElementById('drawerTakeawaysSection').style.display = 'none';
            }

            document.getElementById('drawerOverlay').classList.add('active');
        }

        function closeDrawer(e) {
            if (e && e.target !== e.currentTarget && e.target.className !== 'drawer-close') return;
            document.getElementById('drawerOverlay').classList.remove('active');
            activeReel = null;
        }

        async function deleteCurrentReel() {
            if (!activeReel) return;
            await deleteReel(activeReel.id);
            closeDrawer();
        }

        async function deleteReel(id) {
            if (currentUser === 'demo') {
                alert("Demo Showcase Vault: Deletion is disabled in public demo mode.");
                return;
            }
            if (!confirm(`Delete bookmark #${id} from your vault?`)) return;
            try {
                await fetch(`/api/reels/${currentUser}/${id}`, { method: 'DELETE' });
                await refreshVault();
            } catch (err) {
                console.error("Failed to delete reel:", err);
            }
        }

        function exportData(format) {
            if (!currentUser) return;
            window.location.href = `/api/reels/${currentUser}/export?format=${format}`;
        }

        function showEmptyWorkspace(title, subtitle) {
            const canvas = document.getElementById('workspaceCanvas');
            canvas.innerHTML = `
                <div class="empty-state">
                    <div class="icon" style="display:flex; justify-content:center; margin-bottom:14px; opacity:0.35;">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>
                    </div>
                    <h3>${escapeHtml(title)}</h3>
                    <p style="font-size:13px; max-width:400px; margin:0 auto; line-height:1.5;">${escapeHtml(subtitle)}</p>
                </div>
            `;
        }

        function escapeHtml(str) {
            const d = document.createElement('div');
            d.textContent = str || '';
            return d.innerHTML;
        }

        // Run
        init();
    </script>
</body>
</html>
