<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="minBg" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#181528" />
      <stop offset="100%" stop-color="#09080e" />
    </radialGradient>

    <linearGradient id="prism" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="40%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="glowG" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <filter id="markGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="115" fill="url(#minBg)" />
  <rect width="510" height="510" x="1" y="1" rx="114" fill="none" stroke="#2e274c" stroke-width="2" />

  <!-- Stylized Geometric "R" + Cube Archive + Play Glyph -->
  <g transform="translate(4, 0)" filter="url(#markGlow)">
    <!-- Vertical Spine of R / Left Edge of Box -->
    <rect x="156" y="140" width="36" height="232" rx="18" fill="url(#prism)" />

    <!-- Top Loop of R / Curved Reel -->
    <path d="M 174 140 H 268 C 324 140, 360 174, 360 226 C 360 278, 324 312, 268 312 H 174" 
          fill="none" 
          stroke="url(#prism)" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Diagonal Leg of R pointing outward like an open box flap -->
    <path d="M 252 296 L 344 372" 
          stroke="url(#glowG)" 
          stroke-width="36" 
          stroke-linecap="round" />

    <!-- Play Arrow nestled inside the loop -->
    <polygon points="248,206 286,226 248,246" fill="#ffffff" />

    <!-- Film Reel Dots along top loop -->
    <circle cx="215" cy="140" r="5" fill="#09080e" />
    <circle cx="270" cy="140" r="5" fill="#09080e" />
    <circle cx="330" cy="180" r="5" fill="#09080e" />
    <circle cx="342" cy="226" r="5" fill="#09080e" />
  </g>
</svg>
